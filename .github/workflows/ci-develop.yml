# ============================================================
# CI ONLY — runs on feature branches and develop
# Purpose: catch broken code before it reaches develop or main
# ============================================================
name: CI — Build and Test

on:
  push:
    branches:
      - develop
      - 'feature/**'    # matches feature/user-management, feature/auth, etc.
  pull_request:
    branches:
      - develop         # runs when you open PR → develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Unit" \
            --verbosity normal \
            --logger "trx;LogFileName=unit-results.trx"

      - name: Run integration tests
        run: |
          dotnet test --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Integration" \
            --verbosity normal \
            --logger "trx;LogFileName=integration-results.trx"

      # Shows test results directly inside the GitHub PR page
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()   # run even if tests fail — so you can see what broke
        with:
          name: Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
