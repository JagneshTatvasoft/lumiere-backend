# ============================================================
# CI/CD — runs ONLY on main
# Purpose: final gate before production deploy
# ============================================================
name: CI/CD — Build, Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main            # also runs CI when PR to main is opened

jobs:
  # ──────────────────────────────────────────
  # JOB 1: BUILD
  # ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: .
          retention-days: 1

  # ──────────────────────────────────────────
  # JOB 2: TEST — runs after build
  # ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      checks: write
      pull-requests: write
      
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore

      - name: Run ALL tests
        run: |
          dotnet test \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Production Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

  # ──────────────────────────────────────────
  # JOB 3: DEPLOY — only runs if tests pass
  # ──────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Deploy to Azure staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Print staging URL
        run: |
          echo "Deployed to staging!"
          echo "Test at: https://app-demo-kr-central-001-ccdgh4f3aqfreheq.koreacentral-01.azurewebsites.netDD"
