# ============================================================
# AI CODE REVIEW — comments on every PR automatically
# Uses GitHub's built-in code scanning
# ============================================================
name: PR Code Review

on:
  pull_request:
    branches:
      - develop

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # needed to post comments on the PR

    steps:
      - uses: actions/checkout@v4

      # Checks for common .NET code issues and posts inline comments
      - name: Run .NET code analysis
        run: |
          dotnet build \
            --configuration Release \
            /p:EnableNETAnalyzers=true \
            /p:AnalysisLevel=latest \
            /p:TreatWarningsAsErrors=false \
            /warnaserror- \
            2>&1 | tee build-warnings.txt

      # Posts a summary comment on the PR
      - name: Comment build warnings on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const warnings = fs.readFileSync('build-warnings.txt', 'utf8');
            const filtered = warnings
              .split('\n')
              .filter(l => l.includes('warning') || l.includes('error'))
              .slice(0, 20)  // max 20 lines to keep comment readable
              .join('\n');

            if (filtered.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Code Analysis Results\n\`\`\`\n${filtered}\n\`\`\``
              });
            }
